<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basecamp Homepage Test</title>
    <link rel="stylesheet" href="./css-new/styles.css" />
    <link rel="stylesheet" href="./css-new/bootstrap.min.css" />
</head>

<body>
    <header>
        <div class="wrapper-header">
            <div class="row">
                <div class="col-12 col-sm-12 col-md-12 col-lg-6 offset-lg-3 col-xl-6 offset-xl-3">
                    <div class="row">
                        <div class="wrap-logo col-3">
                            <a href="/">
                                <img class="logo img-fluid" src="../images-new/logo.jpg" alt="Basecamp Logo" />
                            </a>
                        </div>
                        <div class="tagline col-4">
                            <span class="tag-text">Official <a href="/qualifications/basi" title="BASI">BASI</a>&nbsp;
                                and
                                <a href="/qualifications/csia" title="CSIA">CSIA</a> instructor courses</span>
                        </div>
                        <div class="content-info col-5">
                            <button class="button-booking">Booking & Enquiries</button>
                            <h3 class="phone">+44 (0) 208 789 9055</h3>
                        </div>
                    </div>
                    <div class="row">
                        <div class="wrapper-nav col-12">
                            <span class="col-2">
                                <a class="navbar-option" href="#">Resorts <label class="separator">|</label></a>
                            </span>
                            <span class="col-2">
                                <a class="navbar-option" href="#">Ski Courses<label class="separator">|</label></a>
                            </span>
                            <span class="col-2">
                                <a class="navbar-option" href="#">Snowboard Courses <label
                                        class="separator">|</label></a>
                            </span>
                            <span class="col-2">
                                <a class="navbar-option" href="#">Seasonal Accommodation <label
                                        class="separator">|</label></a>
                            </span>
                            <span class="col-2">
                                <a class="navbar-option" href="#">Dates & Prices <label class="separator">|</label></a>
                            </span>
                            <span class="col-2">
                                <a class="navbar-option" href="#">Booking</label></a>
                            </span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </header>
    <div class="board-wrapper">
        <div class="row">
            <div
                class="col-12 col-sm-12 col-md-12 col-lg-6 offset-lg-3 col-xl-6 offset-xl-3 position-relative wrapper-bg">
                <div class="wrapper-options-info row text-white p-4">
                    <div class="col-6">
                        <h1>Ski & Snowboard Courses</h1>
                        <p>
                            Improve your performance or become a qualified instructor with the most fanatical snowsport
                            company out there
                        </p>
                    </div>
                    <div class="col-6 d-flex align-items-center">
                        <img class="img-video img-fluid" src="http://img.youtube.com/vi/YYZ4AJ3GBqY/0.jpg"
                            alt="Watch Video" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
